name: Woordkracht Python tests

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application and modules
        run: python -m compileall -q streamlit_app.py vocab_core.py free_practice.py browser_progress.py
      - name: Run regression tests
        run: python -m unittest discover -v
